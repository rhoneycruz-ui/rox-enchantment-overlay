[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rox-enchantment-overlay"
version = "1.2.1"
description = "Overlay local para calcular custos de encantamento de Prontera em Ragnarok X"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mss>=10,<11",
    "numpy>=2,<3",
    "opencv-python-headless>=4.10,<6",
    "PySide6>=6.8,<7",
    "windows-capture>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.8", "mypy>=1.13", "pyinstaller>=6.10"]

[project.scripts]
rox-overlay = "rox_overlay.app:main"

[tool.setuptools.package-data]
rox_overlay = ["assets/*.png", "assets/stones/*.png", "assets/*.ico", "assets/fonts/*", "data/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"



[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E402", "UP046", "UP047"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
