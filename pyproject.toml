[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rox-enchantment-overlay"
version = "0.1.0"
description = "Offline Ragnarok X enchantment cost overlay"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "opencv-python-headless>=4.10,<6",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"



